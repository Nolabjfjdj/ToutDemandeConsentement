name: Inspect Everything Consent JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "EverythingConsent-forge-1.20.1-1.1.jar"
      - ".github/workflows/inspect-jar.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect JAR and decompile classes
        shell: bash
        run: |
          set -euo pipefail
          JAR="EverythingConsent-forge-1.20.1-1.1.jar"
          mkdir -p inspection
          unzip -l "$JAR" > inspection/jar-contents.txt
          unzip -p "$JAR" META-INF/mods.toml > inspection/mods.toml
          unzip -Z1 "$JAR" | grep '\\.class$' > inspection/classes.txt
          while IFS= read -r file; do
            unzip -p "$JAR" "$file" | strings -n 3 | sed "s#^#$file: #" >> inspection/class-strings.txt
          done < inspection/classes.txt
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p inspection/decompiled
          java -jar /tmp/cfr.jar "$JAR" --outputdir inspection/decompiled --silent true
          grep -RInE 'literal\\(|translatable\\(|Component\\.|new String|String ' inspection/decompiled > inspection/ui-string-candidates.txt || true
          unzip -Z1 "$JAR" | grep -E '^assets/[^/]+/lang/[^/]+\\.json$' > inspection/language-files.txt || true
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "inspection/languages/$(dirname "$file")"
            unzip -p "$JAR" "$file" > "inspection/languages/$file"
          done < inspection/language-files.txt
          printf 'JAR: %s\\n' "$JAR" > inspection/summary.txt
          printf 'Size: ' >> inspection/summary.txt
          stat -c '%s bytes' "$JAR" >> inspection/summary.txt
          printf '\\nLanguage files found:\\n' >> inspection/summary.txt
          cat inspection/language-files.txt >> inspection/summary.txt

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: everything-consent-jar-inspection
          path: inspection/
          if-no-files-found: error
          retention-days: 7
