name: Build French Everything Consent JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "EverythingConsent-forge-1.20.1-1.1.jar"
      - "scripts/translate_class_strings.py"
      - ".github/workflows/build-french-jar.yml"

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Translate embedded Java strings and add French locale
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL="EverythingConsent-forge-1.20.1-1.1.jar"
          OUTPUT="EverythingConsent-forge-1.20.1-1.1-fr-FR.jar"
          WORK="$RUNNER_TEMP/jar-work"
          LANG_DIR="assets/the_worst_possible_annoyance_mod/lang"
          test -f "$ORIGINAL"
          mkdir -p "$WORK"
          unzip -q "$ORIGINAL" -d "$WORK"
          python scripts/translate_class_strings.py "$WORK"
          mkdir -p "$WORK/$LANG_DIR"
          WORK="$WORK" LANG_DIR="$LANG_DIR" python - <<'PY'
          import json, os
          from pathlib import Path
          translations = {
              "key.categories.the_worst_possible_annoyance_mod": "Tout Demande Consentement",
              "key.the_worst_possible_annoyance_mod.shop": "Ouvrir / fermer la boutique"
          }
          path = Path(os.environ["WORK"]) / os.environ["LANG_DIR"] / "fr_fr.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(translations, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUTPUT" .)
          unzip -t "$OUTPUT"
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          jar = Path("EverythingConsent-forge-1.20.1-1.1-fr-FR.jar")
          with zipfile.ZipFile(jar) as z:
              lang = json.loads(z.read("assets/the_worst_possible_annoyance_mod/lang/fr_fr.json"))
              assert len(lang) == 2
              class_files = [n for n in z.namelist() if n.endswith(".class")]
              assert class_files, "No class files in output JAR"
              assert z.testzip() is None, "Corrupt ZIP entry"
          print(f"Validated JAR structure, {len(class_files)} class files, and {len(lang)} language keys.")
          PY
          ls -lh "$OUTPUT"

      - name: Upload French JAR
        uses: actions/upload-artifact@v4
        with:
          name: EverythingConsent-Forge-1.20.1-French
          path: EverythingConsent-forge-1.20.1-1.1-fr-FR.jar
          if-no-files-found: error
          retention-days: 7
